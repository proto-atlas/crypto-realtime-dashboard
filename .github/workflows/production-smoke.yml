name: 公開環境確認

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"

permissions: {}

jobs:
  production-smoke:
    name: 公開URLの応答確認
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: トップ画面を確認
        run: |
          response_file=$(mktemp)
          status=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            --output "$response_file" --write-out "%{http_code}" \
            "https://crypto-realtime-dashboard.pages.dev/")
          test "$status" = "200"
          test -s "$response_file"
          grep -F "<div id=\"root\"></div>" "$response_file"
